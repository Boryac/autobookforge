# =====================================================================
# 广告 / 水印 / 元信息清理配置
#
# 三类噪声分开处理：
#   site_names       站点名      行内只有站点名，或与推广词共现 -> 整行删除
#   promo_fragments  推广导流语  两词以上共现 -> 整行删除
#   ad_keywords      广告词      两词以上共现 -> 整行删除
#
# 另有两条硬规则（不依赖本文件）：
#   - 含 URL / 裸域名的行：整行字数 <= 70 或中文字 <= 12 时删除，否则只剥离 URL 子串
#   - 段尾站点名：就地剥离，不删整段（避免把含站点名的正文误删）
#
# protect_words：出现这些词的行一律不判为水印（保护正文中的正常提及）。
# extra_patterns：追加正则，命中即删。
# =====================================================================

