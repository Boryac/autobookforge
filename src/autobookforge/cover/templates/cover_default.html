<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  :root{
    --paper:#fbfaf6; --ink:#26241f; --muted:#8a8474; --accent:#e0f247; --gold:#b29e62;
    --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.34'/></svg>");
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  .cover{
    position:relative;width:800px;height:1280px;overflow:hidden;
    background:linear-gradient(165deg,#fbfaf6 0%,#f2ecdc 100%);
    color:var(--ink);
    font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","SimSun",serif;
  }
  .grain{position:absolute;inset:0;background-image:var(--noise);background-size:140px 140px;
    opacity:.5;mix-blend-mode:multiply;pointer-events:none}
  .band-top{position:absolute;left:0;right:0;top:0;height:16px;background:var(--accent)}
  .band-bottom{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--gold)}
  .inner{position:absolute;inset:0;padding:120px 96px;display:flex;flex-direction:column}
  .dot{width:22px;height:22px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 12px rgba(224,242,71,.16);margin-bottom:88px}
  .title{font-size:78px;line-height:1.26;font-weight:600;letter-spacing:.06em;color:#26241f;margin:0}
  .rule{width:190px;height:3px;background:var(--gold);margin:56px 0 44px}
  .author{font-size:34px;color:var(--muted);letter-spacing:.14em}
  .spacer{flex:1}
  .brand{display:flex;align-items:center;gap:16px;padding-top:28px;border-top:1px solid var(--gold)}
  .brand img{width:96px;height:96px;object-fit:contain}
  .brand .name{font-size:24px;color:var(--muted);letter-spacing:.08em}
  .brand .sub{font-size:18px;color:#a9a294;margin-top:4px}
</style>
</head>
<body>
  <div class="cover">
    <i class="grain"></i>
    <div class="band-top"></div>
    <div class="band-bottom"></div>
    <div class="inner">
      <div class="dot"></div>
      <h1 class="title">{{TITLE}}</h1>
      <div class="rule"></div>
      <div class="author">{{AUTHOR}}</div>
      <div class="spacer"></div>
      <div class="brand">
        <img src="logo.jpg" alt="AutoBookForge">
        <div>
          <div class="name">AutoBookForge</div>
          <div class="sub">TXT 精排电子书引擎</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
